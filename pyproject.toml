[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-tracker"
version = "0.1.0"
description = "Local-first policy tracking pipeline for public-sector agendas and supporting documents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=5.5.0",
  "pyyaml>=6.0",
]

[project.scripts]
policy-tracker = "policy_tracker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
