sources:
  - source_ref: la_city_primegov_archive
    source_name: LA City PrimeGov archive and meeting portal
    current_source_id: la_city_agendas
    status: active
    activation_stage: active
    collection_role: primary
    source_type: web_api_and_portal
    source_shape:
      - public_api
      - javascript_app
      - document_portal
    access_model: public_anonymous
    public_urls:
      - label: PrimeGov portal
        url: https://lacity.primegov.com/
      - label: PrimeGov public portal mirror
        url: https://portal-lacity.primegov.com/
      - label: Archived meetings API
        url: https://lacity.primegov.com/api/v2/PublicPortal/ListArchivedMeetingsByDate
    local_download_root: local/downloads/la_city_agendas
    parser: la_city_primegov_html
    adapter_candidate: la_city_primegov_online
    schedule:
      cadence: daily
      preferred_time_local: "06:00"
      timezone: America/Los_Angeles
      lookback_days: 14
    freshness:
      last_known_successful_import: 2026-06-02
      latest_imported_meeting_date: 2026-05-29
      last_failure: null
    known_document_types:
      - agenda_html
      - agenda_pdf
      - cancellation_notice
    artifact_types:
      - agenda
      - supplemental_agenda
      - cancellation_notice
    storage_policy:
      canonical_artifact: agenda_html
      companion_artifacts:
        - agenda_pdf
      low_value_artifacts:
        - cancellation_notice
      dedupe_keys:
        - meetingTemplateId
        - sha256
        - source_url
    provenance_fields:
      - source_url
      - meetingTemplateId
      - meeting_date
      - body_name
      - fetched_at
      - sha256
    activation_checks:
      - Fetch recent archived meetings API response.
      - Select target committees and agenda templates.
      - Download canonical HTML or PDF agenda.
      - Extract text and verify item count greater than zero for non-cancellation agendas.
      - Import into runtime SQLite and verify latest meeting date advances.
    current_notes: >
      Best primary source for LA City agenda checks. Existing backfill script
      calls the archived meetings API and downloads selected City Council and
      Housing/Homelessness Committee agenda documents. Gmail Clerk notices are
      useful as alerts and for meeting-template links.
    gaps:
      - Source config currently has base_url null even though PrimeGov URLs are known.
      - Need a routine incremental online check separate from Gmail notices.

  - source_ref: la_city_clerk_listserv_gmail
    source_name: LA City Clerk listserv agenda notices in Gmail
    current_source_id: la_city_agendas
    status: active
    activation_stage: active
    collection_role: alert_backstop
    source_type: gmail_notice
    source_shape:
      - email_notice
    access_model: email_subscription
    public_urls:
      - label: Council agenda subscription page
        url: https://www.lacity.org/your-government/council-votes/subscribe-council-meeting-agendas
    gmail_query: subject:(agenda OR agendas) (from:cityofla.org OR from:lacity.org) -in:trash -in:spam
    local_download_root: local/downloads/la_city_agendas
    parser: la_city_primegov_html
    adapter_candidate: la_city_gmail
    schedule:
      cadence: daily
      preferred_time_local: "06:15"
      timezone: America/Los_Angeles
      lookback_days: 7
    freshness:
      last_known_successful_import: 2026-06-01
      latest_imported_meeting_date: 2026-05-27
      last_failure: null
    known_document_types:
      - email_notice_html
      - primegov_meeting_link
    artifact_types:
      - agenda
      - cancellation_notice
      - supplemental_agenda
    storage_policy:
      canonical_artifact: linked_primegov_agenda
      companion_artifacts:
        - email_notice_html
      low_value_artifacts:
        - cancellation_notice
      dedupe_keys:
        - gmail_message_id
        - primegov_meeting_template_id
    provenance_fields:
      - gmail_message_id
      - sender
      - recipients
      - subject
      - email_ts
      - attachment_filename
      - primegov_url
    current_notes: >
      Useful for fresh alerts, continuation agendas, cancellations, and source
      provenance. Should not be the only LA City ingestion path.
    gaps:
      - Depends on connected mailbox and listserv delivery.

  - source_ref: la_county_bos_live_agenda_page
    source_name: LA County BOS live board meeting agenda page
    current_source_id: la_county_board_agendas
    status: needs_review
    activation_stage: sampled
    collection_role: secondary
    source_type: website
    source_shape:
      - javascript_app
      - document_portal
    access_model: public_anonymous
    public_urls:
      - label: Board meeting agendas
        url: https://bos.lacounty.gov/board-meeting-agendas/
    local_download_root: local/downloads/la_county_board_agendas
    parser: lacounty_govdelivery_email
    adapter_candidate: la_county_bos_current_page
    schedule:
      cadence: daily
      preferred_time_local: "06:30"
      timezone: America/Los_Angeles
      lookback_days: 120
    freshness:
      last_known_successful_import: null
      latest_imported_meeting_date: 2026-05-20
      last_failure: Download-only current check succeeds; structured refresh is blocked by unregistered/page-inappropriate parser lacounty_govdelivery_email.
    known_document_types:
      - board_agenda_page
      - agenda_packet_pdf
      - supporting_document_pdf
    artifact_types:
      - agenda
      - agenda_packet
      - board_letter
      - motion
      - public_comment
      - supplemental_agenda
    storage_policy:
      canonical_artifact: board_agenda_page_or_packet
      companion_artifacts:
        - direct_pdf_link
      supporting_artifacts:
        - board_letter
        - motion
        - public_comment
      dedupe_keys:
        - meeting_date
        - source_url
        - sha256
    provenance_fields:
      - source_url
      - meeting_date
      - agenda_page_url
      - linked_document_url
      - fetched_at
      - sha256
    activation_checks:
      - Fetch live page and identify current meeting records.
      - Resolve linked agenda packet and supporting documents.
      - Save page metadata and direct PDFs with source URLs.
      - Verify parser choice is page-aware, not only Gmail-email-aware.
    current_notes: >
      Live page is a Nuxt app with server-rendered agenda cards and direct
      links to current HTML and PDF agenda artifacts. The existing snapshot
      parser can read the live HTML, so the current check can download agenda
      artifacts without browser automation. It remains a short rolling window
      and is not reliable as the sole historical source.
    gaps:
      - Parser/source config is still Gmail-oriented rather than page-oriented.
      - Supporting-document expansion beyond listed agenda/supplemental links still needs design.

