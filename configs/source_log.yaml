version: 1
updated_at: 2026-06-02
purpose: >
  Inventory public-sector bodies and the online locations where agenda,
  minutes, proceedings, staff-report, and supporting-document materials can be
  found. This log is broader than active ingestion configs: it includes primary
  sources, backstops, candidate sources, and notes for future onboarding.
  It is also intended as an agent-readable activation queue: future runs should
  be able to inspect this file, find sources marked ready_for_activation, and
  scaffold or run the matching ingestion path.

source_status_values:
  - active
  - candidate
  - backstop
  - deprecated
  - needs_review

collection_role_values:
  - primary
  - secondary
  - alert_backstop
  - historical_backfill
  - reference_only

activation_stage_values:
  - discovered
  - inventoried
  - sampled
  - ready_for_activation
  - active
  - blocked
  - retired

source_shape_values:
  - public_api
  - static_html
  - javascript_app
  - document_portal
  - rss_or_feed
  - email_notice
  - pdf_archive
  - search_index
  - manual_upload

artifact_type_values:
  - agenda
  - agenda_packet
  - minutes
  - statement_of_proceedings
  - staff_report
  - board_letter
  - motion
  - ordinance
  - resolution
  - contract
  - budget_document
  - presentation
  - public_comment
  - cancellation_notice
  - supplemental_agenda

access_model_values:
  - public_anonymous
  - public_with_session
  - email_subscription
  - api_key_required
  - login_required
  - manual_only

storage_priority_values:
  - canonical
  - companion
  - supporting
  - low_value
  - metadata_only

activation_queue:
  - source_ref: la_city_primegov_archive
    desired_action: Build incremental online check using archived meetings API.
    priority: high
    owner_note: Primary replacement for Gmail-first LA City agenda refresh.
  - source_ref: la_county_bos_live_agenda_page
    desired_action: Build current-agenda page crawler and supporting-document expansion.
    priority: high
    owner_note: Needed for current BOS agenda packets beyond SOP historical backfill.
  - source_ref: lahsa_document_library
    desired_action: Inventory LAHSA document scopes and identify agenda/minutes-bearing document types.
    priority: medium
    owner_note: Regional homelessness source; promote only after agenda-bearing scopes are confirmed.

