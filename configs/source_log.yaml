  - source_ref: la_county_ceo_agendas_archive
    source_name: LA County CEO agenda archive
    current_source_id: la_county_ceo_agendas
    status: active
    activation_stage: active
    collection_role: primary
    source_type: web_archive
    source_shape:
      - public_api
      - static_html
      - pdf_archive
    access_model: public_anonymous
    public_urls:
      - label: CEO agendas
        url: https://ceo.lacounty.gov/agendas/
      - label: CEO agenda data API
        url: https://ceo.lacounty.gov/wp-json/blade-child/v1/agenda-data
    local_download_root: local/downloads/la_county_ceo_agendas
    parser: la_county_cluster_text
    adapter_candidate: la_county_ceo_agendas_archive
    tracked_body_names:
      - Community Services Cluster
      - Operations Cluster
      - Family and Social Services Cluster
      - Health and Mental Health Services Cluster
      - Public Safety Cluster
      - Homelessness and Housing Cluster
      - Affordable Housing
      - Community Care and Justice
      - Executive Committee for Regional Homeless Alignment
      - LACTA Board Deputies
      - Leadership Table for Regional Homeless Alignment
      - Real Estate Management Commission
    schedule:
      cadence: daily
      preferred_time_local: "07:15"
      timezone: America/Los_Angeles
      lookback_days: 30
      lookahead_days: 14
    freshness:
      last_known_successful_import: 2026-06-02
      latest_imported_meeting_date: 2026-06-03
      last_failure: null
    known_document_types:
      - cluster_agenda_pdf
      - commission_agenda_pdf
      - cancellation_notice_pdf
      - supporting_document_pdf
    artifact_types:
      - agenda
      - agenda_packet
      - minutes
      - cancellation_notice
      - supporting_document
    storage_policy:
      canonical_artifact: agenda_pdf
      supporting_artifacts:
        - supporting_document_pdf
      low_value_artifacts:
        - cancellation_notice_pdf
      daily_check_scope:
        - agenda_pdf
      backfill_scope:
        - supporting_document_pdf
      dedupe_keys:
        - source_url
        - meeting_date
        - body_name
        - sha256
    provenance_fields:
      - documentId
      - source_url
      - meeting_date
      - body_name
      - fetched_at
      - sha256
    activation_checks:
      - Fetch the agenda-data API and verify it returns current agenda records.
      - Map department abbreviations to canonical body names.
      - Download selected agenda PDFs into the source download root.
      - Extract PDF text and verify canonical agenda candidates refresh.
      - Preserve supporting-document review targets separately from canonical agendas.
    current_notes: >
      Strong direct web source for cluster and commission agendas. The live
      website now renders agenda rows through the agenda-data API rather than
      static h4 sections, so the scraper should prefer that API and keep static
      HTML parsing as fallback. Daily checks should be agenda-first; supporting
      documents should run as a separate backfill/review workflow.
    gaps:
      - Some commission and packet variants still need parser-family expansion.
      - Supporting-document ingestion is valuable but too slow to couple to every daily agenda check.

  - source_ref: lahsa_document_library
    source_name: LAHSA document library
    current_source_id: lahsa_documents
    status: active
    activation_stage: active
    collection_role: primary
    source_type: document_library
    source_shape:
      - document_portal
      - static_html
    access_model: public_anonymous
    public_urls:
      - label: Document library
        url: https://www.lahsa.org/documents
      - label: Finance scope
        url: https://www.lahsa.org/documents?scope=106
      - label: Policy scope
        url: https://www.lahsa.org/documents?scope=107
    local_download_root: local/downloads/lahsa_documents
    parser: supporting_document_text
    adapter_candidate: lahsa_document_library
    tracked_scope_ids:
      - 106
      - 107
    tracked_keywords:
      - agenda
      - minutes
      - commission
      - board
      - budget
      - policy
      - governance
    max_documents_per_scope: 20
    schedule:
      cadence: weekly
      preferred_time_local: "07:45"
      timezone: America/Los_Angeles
      lookback_days: 30
    freshness:
      last_known_successful_import: 2026-06-03
      latest_imported_meeting_date: 2025-12-10
      last_failure: null
    known_document_types:
      - budget_document
      - report
      - form
      - training_material
      - policy_document
    artifact_types:
      - budget_document
      - staff_report
      - presentation
      - contract
    storage_policy:
      canonical_artifact: document_pdf
      dedupe_keys:
        - lahsa_document_id
        - source_url
        - sha256
      metadata_fields:
        - document_type
        - project
        - project_scope
        - published_date
        - last_modified
    provenance_fields:
      - lahsa_document_id
      - source_url
      - download_url
      - document_type
      - project_scope
      - published_date
      - last_modified
      - fetched_at
      - sha256
    activation_checks:
      - Crawl document-library scope pages and record scope names and IDs.
      - Sample detail pages and parse JSON-LD, direct download URL, document type, project scope, published date, and last-modified date.
      - Search or filter for Commission, agenda, minutes, budget, and policy document types.
      - Promote agenda-bearing subsets into dedicated active source entries before scheduled ingestion.
    current_notes: >
      LAHSA exposes an ASP.NET WebForms document library with scope pages and
      stable detail/download URLs. Detail pages include JSON-LD plus explicit
      metadata fields such as document type, project scope, published date, and
      last modified date. The first active pass tracks Finance and Policy scope
      pages with agenda/minutes/commission/board/budget/policy/governance
      keywords so the pipeline can gather public-budget and governance material
      without pulling the entire library. First production run downloaded and
      structured 16 visible Finance/Policy documents with zero fetch failures.
    gaps:
      - Need identify whether agendas/minutes are first-class document types or only searchable titles.
      - Current crawler reads visible scope-page results; WebForms pagination and postback filters still need expansion.
      - Supporting-document parser is generic; raw document published dates are reliable, but structured dates can reflect dates found inside the document text.
